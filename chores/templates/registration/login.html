{% extends "base.html" %}
{% block title %}Log in · Household chores{% endblock %}
{% block content %}
<div class="card"><h1>Log in</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Log in</button></form>
  <p>Need an account? <a href="{% url 'register' %}">Register</a>.</p>
</div>
{% endblock %}
