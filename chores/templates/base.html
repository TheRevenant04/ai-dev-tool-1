<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Household chores{% endblock %}</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17202a; background: #f5f7fa; }
    body { max-width: 960px; margin: 0 auto; padding: 1rem; }
    nav { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 2rem; }
    nav a { color: #1769aa; }
    .spacer { flex: 1; }
    .card { background: white; border-radius: .6rem; padding: 1rem 1.25rem; margin: 1rem 0; box-shadow: 0 1px 4px #0001; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    label { display: block; font-weight: 600; margin-top: .75rem; }
    input, textarea, select { box-sizing: border-box; width: 100%; padding: .55rem; margin-top: .25rem; }
    button, .button { display: inline-block; border: 0; border-radius: .35rem; padding: .55rem .8rem; background: #1769aa; color: white; text-decoration: none; cursor: pointer; }
    .button.secondary { background: #64748b; } .button.danger { background: #b42318; }
    .inline { display: inline; } .muted { color: #667085; } .done { text-decoration: line-through; opacity: .65; }
    .message { padding: .7rem; background: #e6f4ea; border-radius: .35rem; }
    .errorlist { color: #b42318; padding-left: 1.2rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}"><strong>Household chores</strong></a>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Chores</a>
      {% if user.household_memberships.exists %}<a href="{% url 'chore-create' %}">Add chore</a>{% endif %}
      <span class="spacer"></span><span class="muted">{{ user.username }}</span>
      <a href="{% url 'logout' %}">Log out</a>
    {% else %}
      <span class="spacer"></span><a href="{% url 'login' %}">Log in</a>
      <a class="button" href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
  {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
