{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Shared chores, without the nagging</h1>
  <p>Plan one-off and recurring chores, rotate assignments fairly, and keep everyone in the loop.</p>
  {% if user.is_authenticated %}
    <a class="button" href="{% url 'dashboard' %}">Open household</a>
  {% else %}
    <a class="button" href="{% url 'register' %}">Get started</a>
    <a class="button secondary" href="{% url 'login' %}">Log in</a>
  {% endif %}
</section>
{% endblock %}
